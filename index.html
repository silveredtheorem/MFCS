<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFCS Assignment Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #fefefe);
      color: #333;
      transition: background 0.4s ease;
    }
    header, footer {
      background: #1e40af;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      transition: all 0.3s ease-in-out;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
    }
    nav ul {
      display: flex;
      justify-content: center;
      background: #2563eb;
      padding: 1rem 0;
      list-style: none;
      gap: 2rem;
    }
    nav ul li a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }
    nav ul li a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: #dbeafe;
      transition: width 0.3s ease;
    }
    nav ul li a:hover::after {
      width: 100%;
    }
    main {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
      animation: fadeIn 0.5s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.12);
    }
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .student-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .student-card:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transform: scale(1.02);
    }
    .student-card h3 {
      font-size: 1.1rem;
      color: #1e40af;
      margin-bottom: 0.3rem;
    }
    .student-card p {
      margin: 0.2rem 0;
    }
    .search-container {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .search-container input {
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      font-size: 1rem;
      transition: box-shadow 0.3s ease;
    }
    .search-container input:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
      outline: none;
    }
    .section-content {
      display: none;
      transition: opacity 0.4s ease;
    }
    .section-content.active {
      display: block;
    }
    .question {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #f1f5f9;
      border-left: 6px solid #3b82f6;
      border-radius: 10px;
    }
    .question h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #1e3a8a;
    }
    .answer {
      margin-top: 1rem;
      background: #fef9c3;
      border-left: 5px solid #facc15;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.05);
    }
    .answer strong {
      color: #92400e;
    }
    .supplementary {
      margin-top: 1rem;
    }
    .supplementary iframe, .supplementary img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 0.75rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #1d4ed8;
      transform: scale(1.02);
    }
    footer p {
      font-size: 0.95rem;
      opacity: 0.85;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>MFCS Assignment Responses</h1>
  </header>
  <nav>
    <ul>
      <li><a href="#" class="nav-link" data-section="home">Home</a></li>
      <li><a href="#" class="nav-link" data-section="students">Students</a></li>
    </ul>
  </nav>
  <main>
    <section id="home" class="section-content active">
      <div class="card" id="home-summary">
        <h2>Submission Overview</h2>
        <p><strong>Form Closed At:</strong> April 13, 11:59 PM</p>
        <br>
        <button id="view-students-btn" style="padding: 0.75rem 1.5rem; font-size: 1rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">
          View Student Submissions
        </button>
      </div>

    </section>
    <section id="students" class="section-content">
      <div class="card">
        <h2>Student Submissions</h2>
        <div class="search-container">
          <input type="text" id="student-search" placeholder="Search by name or roll number...">
        </div>
        <div id="student-grid" class="student-grid"></div>
        <div id="data-status"></div>
      </div>
    </section>
    <section id="student-details" class="section-content">
      <div class="card">
        <div id="student-details-content"></div>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; NITW - CSE - B - MFCS</p>
  </footer>
  <script>

      let students = {};

      const studentSearch = document.getElementById('student-search');
      const sections = document.querySelectorAll('.section-content');
      const navLinks = document.querySelectorAll('.nav-link');

    html += `<div class="supplementary"><strong>Supplementary:</strong><br>${embedHtml}</div>`;
  }

  html += `</div>`;
}

        });
        html += `<p><a href="#" class="section-link" data-section="students">&larr; Back to students</a></p>`;
        const container = document.getElementById('student-details-content');
        container.innerHTML = html;
        container.querySelectorAll('.section-link').forEach(link => {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            sections.forEach(section => section.classList.remove('active'));
            document.getElementById(this.getAttribute('data-section')).classList.add('active');
          });
        });
      }

      function processData(data) {
        students = {};
        const nameKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('name'));
        const rollKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('roll'));
        data.forEach(row => {
          if (!row[nameKey] || !row[rollKey]) return;
          let roll = row[rollKey].toString();

          students[roll] = { roll, name: row[nameKey], raw: row };
        });
        const grid = document.getElementById('student-grid');
        grid.innerHTML = '';
        Object.keys(students).sort((a, b) => parseInt(a) - parseInt(b)).forEach(id => {
          const student = students[id];
          const card = document.createElement('div');
          card.className = 'student-card';
          card.innerHTML = `<h3>${student.name}</h3>
                            <p>Roll No: ${student.roll}</p>
                            <p><a href="#" class="view-submission" data-roll="${student.roll}">View Submission</a></p>`;
          grid.appendChild(card);
        });
        document.querySelectorAll('.view-submission').forEach(link => {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            renderStudentDetails(this.getAttribute('data-roll'));
            sections.forEach(section => section.classList.remove('active'));
            document.getElementById('student-details').classList.add('active');
          });
        });

        const masterRolls = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];

      }

      function loadExcel() {
        fetch('mfcs.xlsx')
          .then(res => res.arrayBuffer())
          .then(buffer => {
            const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            processData(data);

          })
          .catch(err => {

      }
        document.getElementById('view-students-btn').addEventListener('click', function() {
      sections.forEach(section => section.classList.remove('active'));
      document.getElementById('students').classList.add('active');
      });

      studentSearch.addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase();
        document.querySelectorAll('.student-card').forEach(card => {
          const studentName = card.querySelector('h3').textContent.toLowerCase();
          const studentId = card.querySelector('p').textContent.toLowerCase();
          card.style.display = (studentName.includes(searchTerm) || studentId.includes(searchTerm)) ? 'block' : 'none';
        });
      });

      navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          sections.forEach(section => section.classList.remove('active'));
          document.getElementById(this.getAttribute('data-section')).classList.add('active');
        });
      });

      loadExcel();
    });
    </script>

</body>
</html>
